name: Build APK

on:
  push:
    branches: [ "arena/63846101-1in8b-mobile", "main" ]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "manifest.json"
      - "sw.js"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone WebView template
        run: |
          git clone --depth 1 https://github.com/ykann88/Html-Css-Js-Web-View-Apk-Template.git template
          ls template/app/src/main/
      - name: Copy app assets
        run: |
          mkdir -p template/app/src/main/assets
          cp -r index.html css js manifest.json sw.js template/app/src/main/assets/ || true
          # also copy nested
          ls -R template/app/src/main/assets | head -n 50
          # Patch package id
          grep -r "applicationId" template/app --include="*.gradle*" || true
          find template/app -name "*.gradle*" -exec sed -i 's/com.example.webview/dev.qretexa.twa1in8b/g' {} \; || true
          find template -name "strings.xml" -exec sed -i 's/WebView Template/1 \u0438\u0437 8 \u043c\u043b\u0440\u0434/g' {} \; || true
          cat template/app/build.gradle 2>/dev/null | head -n 60
          cat template/app/build.gradle.kts 2>/dev/null | head -n 60
      - name: Build debug APK
        working-directory: template
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: 1in8b-mobile-apk
          path: template/app/build/outputs/apk/debug/*.apk
