name: Build APK

on:
  push:
    branches: [ "arena/63846101-1in8b-mobile", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/build-tools | head -n 5
          ls $ANDROID_HOME/platforms | head -n 5
          sdkmanager --list_installed 2>&1 | head -n 30 || true

      - name: Generate project
        run: |
          set -e
          mkdir -p app/src/main/java/dev/qretexa/twa1in8b
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp -r index.html css js manifest.json sw.js app/src/main/assets/ 2>/dev/null || true

          cat > settings.gradle <<'G'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          G

          cat > app/build.gradle <<'G'
          plugins {
            id 'com.android.application' version '8.5.2' apply true
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply true
          }
          android {
            namespace 'dev.qretexa.twa1in8b'
            compileSdk 34
            defaultConfig {
              applicationId "dev.qretexa.twa1in8b"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false }; debug { debuggable true } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          G

          cat > app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="1 из 8 млрд" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          X

          cat > app/src/main/java/dev/qretexa/twa1in8b/MainActivity.kt <<'K'
          package dev.qretexa.twa1in8b
          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebSettings
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            private lateinit var wv: WebView
            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              wv = WebView(this)
              wv.settings.javaScriptEnabled = true
              wv.settings.domStorageEnabled = true
              wv.settings.allowFileAccess = true
              wv.settings.allowContentAccess = true
              wv.settings.cacheMode = WebSettings.LOAD_DEFAULT
              wv.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
              wv.webViewClient = WebViewClient()
              setContentView(wv)
              wv.loadUrl("file:///android_asset/index.html")
            }
            override fun onBackPressed() { if (wv.canGoBack()) wv.goBack() else super.onBackPressed() }
          }
          K

          cat > app/src/main/res/values/themes.xml <<'X'
          <resources><style name="Theme.App" parent="android:style/Theme.NoTitleBar"/></resources>
          X

          ls -R app | head -n 80
          cat app/build.gradle

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 1in8b-mobile-apk
          path: app/build/outputs/apk/debug/*.apk

