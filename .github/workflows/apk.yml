name: Build APK

on:
  push:
    branches: [ "arena/63846101-1in8b-mobile", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          set -e
          mkdir -p app/src/main/java/dev/qretexa/twa1in8b
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          cp -r index.html css js manifest.json sw.js app/src/main/assets/ 2>/dev/null || true
          cat > settings.gradle <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          G
          cat > app/build.gradle <<'G'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'dev.qretexa.twa1in8b'
            compileSdk 34
            defaultConfig { applicationId "dev.qretexa.twa1in8b"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false }; debug { debuggable true } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          G
          cat > app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="1 из 8 млрд" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          X
          cat > app/src/main/java/dev/qretexa/twa1in8b/MainActivity.java <<'J'
          package dev.qretexa.twa1in8b;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.WebSettings; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            private WebView wv;
            @Override protected void onCreate(Bundle b){ super.onCreate(b); wv=new WebView(this); wv.getSettings().setJavaScriptEnabled(true); wv.getSettings().setDomStorageEnabled(true); wv.getSettings().setAllowFileAccess(true); wv.getSettings().setAllowContentAccess(true); wv.getSettings().setCacheMode(WebSettings.LOAD_DEFAULT); wv.getSettings().setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); wv.setWebViewClient(new WebViewClient()); setContentView(wv); wv.loadUrl("file:///android_asset/index.html"); }
            @Override public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          J
          cat > app/src/main/res/values/themes.xml <<'X'
          <resources><style name="Theme.App" parent="android:style/Theme.NoTitleBar"/></resources>
          X
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          ls -R app | head -n 100

      - name: Accept licenses + show SDK
        run: |
          yes | sdkmanager --licenses 2>&1 | head -n 20 || true
          ls $ANDROID_HOME/platforms | head
          ls $ANDROID_HOME/build-tools | head

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; EXIT=${PIPESTATUS[0]}
          echo "EXIT=$EXIT"
          tail -n 200 /tmp/build.log
          if [ $EXIT -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            # create gist via API for us to read (allowed host api.github.com)
            # use gh to create gist
            gh gist create /tmp/build.log --public --desc "build log $GITHUB_RUN_ID" 2>&1 || true
            exit $EXIT
          fi
          ls -lh app/build/outputs/apk/debug/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 1in8b-mobile-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

