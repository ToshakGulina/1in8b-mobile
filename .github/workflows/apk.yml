name: Build APK

on:
  push:
    branches: [ "arena/63846101-1in8b-mobile" ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/dev/qretexa/twa1in8b app/src/main/assets app/src/main/res/values app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cp -r index.html css js manifest.json sw.js app/src/main/assets/ 2>/dev/null || true
          cat > settings.gradle <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          G
          cat > gradle.properties <<'G'
          android.useAndroidX=true
          android.enableJetifier=true
          G
          cat > app/build.gradle <<'G'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'dev.qretexa.twa1in8b'
            compileSdk 34
            defaultConfig { applicationId "dev.qretexa.twa1in8b"; minSdk 24; targetSdk 34; versionCode 2; versionName "1.1" }
            buildTypes { release { minifyEnabled false }; debug { debuggable true } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          G
          cat > app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          X
          cat > app/src/main/res/values/strings.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">1 из 8 млрд</string></resources>
          X
          cat > app/src/main/res/values/themes.xml <<'X'
          <resources><style name="Theme.App" parent="android:style/Theme.NoTitleBar"/></resources>
          X
          # Pillow for icon generation
          pip install --quiet Pillow 2>&1 | tail -n 3
          # Generate icons (red square with "1") via Python + Pillow
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          def make(size, path):
              img = Image.new("RGBA", (size, size), (0,0,0,0))
              draw = ImageDraw.Draw(img)
              # rounded rect background
              r = size//5
              # draw rounded rect
              draw.rounded_rectangle([(0,0),(size-1,size-1)], radius=r, fill=(232,93,63,255))
              # text "1"
              # try to load a font, fallback to default
              try:
                  # DejaVu is available on runner
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size*0.55))
              except:
                  font = ImageFont.load_default()
              text = "1"
              bbox = draw.textbbox((0,0), text, font=font)
              tw, th = bbox[2]-bbox[0], bbox[3]-bbox[1]
              # center
              draw.text(((size-tw)/2, (size-th)/2 - size*0.04), text, fill=(255,255,255,255), font=font)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, "PNG")
              print(f"icon {size} -> {path}")

          for density, sz in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              make(sz, f"app/src/main/res/mipmap-{density}/ic_launcher.png")
              make(sz, f"app/src/main/res/mipmap-{density}/ic_launcher_round.png")
          PY
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -R app/src/main/res | head -n 60
          cat app/src/main/res/values/strings.xml

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>&1 | head -n 5 || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          echo "EXIT=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          ls -lh app/build/outputs/apk/debug/*.apk || true
          head -n 150 /tmp/build.log > /tmp/head.log; tail -n 150 /tmp/build.log > /tmp/tail.log
          grep -i -E "FAILED|error|exception|Could not" /tmp/build.log | head -n 100 > /tmp/grep.log || true

      - name: Post log to commit comment
        if: always()
        run: |
          HEAD_LOG=$(cat /tmp/head.log 2>/dev/null | tr -cd '\11\12\15\40-\176' | head -c 5000 || echo "no head")
          GREP_LOG=$(cat /tmp/grep.log 2>/dev/null | tr -cd '\11\12\15\40-\176' | head -c 5000 || echo "no grep")
          TAIL_LOG=$(cat /tmp/tail.log 2>/dev/null | tr -cd '\11\12\15\40-\176' | head -c 5000 || echo "no tail")
          BODY="**Build ${{ steps.build.outcome }}** head:\n\`\`\`\n$HEAD_LOG\n\`\`\`\ngrep:\n\`\`\`\n$GREP_LOG\n\`\`\`\ntail:\n\`\`\`\n$TAIL_LOG\n\`\`\`"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$BODY" || true
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1in8b-mobile-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Push APK to repo (direct download)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/1in8b-mobile.apk
          ls -lh dist/
          git config user.name "ci-bot"
          git config user.email "ci@bot.local"
          git add dist/1in8b-mobile.apk
          git commit -m "apk: update debug APK [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || true

