name: Build APK

on:
  push:
    branches: [ "arena/63846101-1in8b-mobile" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/dev/qretexa/twa1in8b app/src/main/assets app/src/main/res/values
          cp -r index.html css js manifest.json sw.js app/src/main/assets/ 2>/dev/null || true
          cat > settings.gradle <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          G
          cat > gradle.properties <<'G'
          android.useAndroidX=true
          android.enableJetifier=true
          G
          cat > app/build.gradle <<'G'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'dev.qretexa.twa1in8b'
            compileSdk 34
            defaultConfig { applicationId "dev.qretexa.twa1in8b"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false }; debug { debuggable true } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          G
          cat > app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="1 из 8 млрд" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          X
          cat > app/src/main/java/dev/qretexa/twa1in8b/MainActivity.java <<'J'
          package dev.qretexa.twa1in8b; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.WebSettings; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity { private WebView wv; @Override protected void onCreate(Bundle b){ super.onCreate(b); wv=new WebView(this); wv.getSettings().setJavaScriptEnabled(true); wv.getSettings().setDomStorageEnabled(true); wv.getSettings().setAllowFileAccess(true); wv.getSettings().setAllowContentAccess(true); wv.getSettings().setCacheMode(WebSettings.LOAD_DEFAULT); wv.getSettings().setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); wv.setWebViewClient(new WebViewClient()); setContentView(wv); wv.loadUrl("file:///android_asset/index.html"); } @Override public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); } }
          J
          cat > app/src/main/res/values/themes.xml <<'X'
          <resources><style name="Theme.App" parent="android:style/Theme.NoTitleBar"/></resources>
          X
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -R app | head -n 80
          cat gradle.properties

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>&1 | head -n 5 || true

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          echo "EXIT=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          ls -lh app/build/outputs/apk/debug/*.apk || true
          head -n 150 /tmp/build.log > /tmp/head.log; tail -n 150 /tmp/build.log > /tmp/tail.log
          grep -i -E "FAILED|error|exception|Could not" /tmp/build.log | head -n 100 > /tmp/grep.log || true

      - name: Post log to commit comment
        if: always()
        run: |
          HEAD_LOG=$(cat /tmp/head.log 2>/dev/null | tr -cd '\11\12\15\40-\176' | head -c 5000 || echo "no head")
          GREP_LOG=$(cat /tmp/grep.log 2>/dev/null | tr -cd '\11\12\15\40-\176' | head -c 5000 || echo "no grep")
          TAIL_LOG=$(cat /tmp/tail.log 2>/dev/null | tr -cd '\11\12\15\40-\176' | head -c 5000 || echo "no tail")
          BODY="**Build ${{ steps.build.outcome }}** head:\n\`\`\`\n$HEAD_LOG\n\`\`\`\ngrep:\n\`\`\`\n$GREP_LOG\n\`\`\`\ntail:\n\`\`\`\n$TAIL_LOG\n\`\`\`"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$BODY" || true
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1in8b-mobile-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Push APK to repo (direct download)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/1in8b-mobile.apk
          ls -lh dist/
          git config user.name "ci-bot"
          git config user.email "ci@bot.local"
          git add dist/1in8b-mobile.apk
          git commit -m "apk: update debug APK [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || true

